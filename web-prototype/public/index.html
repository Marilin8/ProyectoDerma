<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DERMA — Acceso</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2v4a3 3 0 0 0 6 0V2" />
          <path d="M9 2h6" />
          <path d="M12 9v7a4 4 0 0 1-8 0v-1" />
          <circle cx="18" cy="18" r="3" />
        </svg>
      </div>

      <h1>DERMA</h1>
      <p class="subtitle">Sistema de Gestión Dermatológica</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
        <button class="tab-btn" data-tab="register">Registrarse</button>
      </div>

      <p class="error-msg" id="errorMsg" hidden></p>

      <form id="loginForm" class="tab-panel active">
        <label for="loginEmail">Usuario</label>
        <input type="email" id="loginEmail" required autocomplete="email" placeholder="correo@ejemplo.com" />

        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />

        <button type="submit">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <path d="M10 17l5-5-5-5" />
            <path d="M15 12H3" />
          </svg>
          Ingresar
        </button>
      </form>

      <form id="registerForm" class="tab-panel">
        <label for="registerName">Nombre</label>
        <input type="text" id="registerName" required autocomplete="name" />

        <label for="registerEmail">Usuario</label>
        <input type="email" id="registerEmail" required autocomplete="email" placeholder="correo@ejemplo.com" />

        <label for="registerPassword">Contraseña</label>
        <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password" />

        <button type="submit">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M19 8v6" />
            <path d="M22 11h-6" />
          </svg>
          Crear cuenta
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
